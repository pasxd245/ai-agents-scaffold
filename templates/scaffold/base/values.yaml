# Base template default values
# Override with --name flag

project:
  name: 'my-project'

# Axis 1 — which root instruction file to write.
#
# `.agents/AGENTS.md` is the heart — always generated, and the single place
# project knowledge lives. Every file below is a stub that points at it. Which
# stubs a repo needs depends on which harnesses it runs and whether each of
# them reads root `AGENTS.md`; see `harness:` below for the other half.
#
#   agentsmd  Root AGENTS.md — the cross-tool convention. Read natively by
#             Codex, Cursor, Jules, Devin, Amp, Zed, Windsurf and Aider; by
#             Claude Code v2.1.277+ when no CLAUDE.md is present; by Gemini
#             CLI and Copilot when opted in.
#   claude    CLAUDE.md. Still on by default: Claude Code's AGENTS.md support
#             is off for sessions that cannot fetch feature flags (Bedrock,
#             Vertex, telemetry disabled) and for the first session after an
#             upgrade. Turn it off only if your whole fleet is covered.
#   gemini    GEMINI.md. The directory `.gemini/` is `harness.gemini`.
#   copilot   .github/copilot-instructions.md.
#
# Note: JavaScript falsy values (false, 0, '', null, undefined) are treated as false.
agents:
  agentsmd: true
  claude: true
  copilot: true
  gemini: false

# Per-stub settings. Every stub points at the same knowledge base; only the
# relative path and the pointer mechanism differ.
#
#   kb_path         Path to .agents/AGENTS.md, relative to the stub.
#   philosophy_path Path to the canonical philosophy doc, relative to the stub.
#   kb_import       Emit `@<kb_path>`. Harnesses that expand inline imports
#                   pull the knowledge base into context at launch; the rest
#                   read the same line as an ordinary path reference.
agentsmd:
  kb_path: '.agents/AGENTS.md'
  philosophy_path: '.agents/context/philosophy.md'
  kb_import: true
claude:
  kb_path: '.agents/AGENTS.md'
  philosophy_path: '.agents/context/philosophy.md'
  kb_import: true
gemini:
  kb_path: '.agents/AGENTS.md'
  philosophy_path: '.agents/context/philosophy.md'
  kb_import: true
copilot:
  kb_path: '../.agents/AGENTS.md'
  philosophy_path: '../.agents/context/philosophy.md'
  kb_import: false

# Axis 2 — which harness directory to create, with its native config.
#
# Independent of `agents:` above. A harness directory carries permission
# rules, native settings and skill refs whether or not a `.md` stub sits
# beside it, and a stub can exist without the directory. Keeping the two apart
# is what lets a repo say "no GEMINI.md, but keep .gemini/".
#
#   claude   .claude/settings.json — `ask` before writing to canon. The
#            authority rules in .agents/AGENTS.md are prose, and instruction
#            files are context rather than configuration; this makes the rule
#            hold. `ask`, not `deny`, so a human can still authorise a change
#            after the warning. Read by Claude Code whether or not CLAUDE.md
#            exists, so turning the stub off is not a request to drop this.
#   gemini   .gemini/settings.json — `context.fileName` listing AGENTS.md and
#            GEMINI.md, which is how Gemini CLI opts in to root AGENTS.md. Also
#            where `skill ref --to .gemini` lands.
#   codex    .codex/ — where `skill ref --to .codex` lands. Codex itself reads
#            root AGENTS.md and has no instruction file of its own.
#
# Renamed in 0.3.0 from `guardrails.claude` and `agents.codex`; the old keys
# are refused with the new name, never silently ignored.
harness:
  claude: true
  gemini: false
  codex: false

# Optional planning surface.
#
#   decisions  .agents/decisions/ — cross-round commitments ("we agreed not to
#              build X until Y"). Round docs are round-scoped and `context/` is
#              canon an agent must follow; neither holds a promise that spans
#              rounds. Off by default: it is real surface, and a repo that has
#              not yet felt the drift does not need it.
#
# Observed in a repo after 15 months of use, where it was invented by hand.
#
#   programs   .agents/plan/programs/ — multi-round work. A round in `cycles/`
#              is one unit of execution; a program is the goal above it, so a
#              cold agent picking up round 5 of 9 knows what it is executing.
#              Off by default: a repo whose work fits in single rounds does not
#              need it.
plan:
  decisions: false
  programs: false
